<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>顔シューティング -自動加工版-</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: sans-serif; color: white; }
        #overlay { position: absolute; inset: 0; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(0,0,0,0.8); }
        
        /* 撮影ガイド */
        #guide-wrap { position: relative; width: 260px; height: 300px; border: 4px solid #0f0; border-radius: 50% 50% 45% 45%; display: none; margin-bottom: 20px; box-shadow: 0 0 20px #0f0; }
        .guide-line { position: absolute; background: rgba(0,255,0,0.5); }
        .eye { top: 40%; width: 50px; height: 2px; }
        .mouth { bottom: 25%; left: 50%; width: 80px; height: 2px; transform: translateX(-50%); }

        .ui-box { text-align: center; }
        button { padding: 15px 40px; font-size: 1.5rem; cursor: pointer; background: #ff4400; color: white; border: none; border-radius: 50px; font-weight: bold; }
        
        #crosshair { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 30px; height: 30px; border: 2px solid white; border-radius: 50%; display: none; z-index: 50; mix-blend-mode: difference; }
        #score-board { position: absolute; top: 20px; left: 20px; font-size: 24px; color: #0f0; display: none; z-index: 80; }
        canvas { display: none; } /* 隠しキャンバス群 */
    </style>
</head>
<body>

<div id="overlay">
    <h1 id="title">顔シューティング</h1>
    <div id="guide-wrap">
        <div class="guide-line eye" style="left: 15%;"></div>
        <div class="guide-line eye" style="right: 15%;"></div>
        <div class="guide-line mouth"></div>
    </div>
    <div class="ui-box">
        <p id="status-msg">PCならマウスで、スマホなら傾けて狙え！</p>
        <button id="btn-main">カメラ起動</button>
        <div id="test-mode" style="margin-top:15px; font-size: 0.8rem; cursor:pointer; text-decoration: underline;">カメラなしでテスト</div>
    </div>
</div>

<div id="score-board">SCORE: 0</div>
<div id="crosshair"></div>

<!-- 表情生成用 -->
<canvas id="canvas-base" width="256" height="256"></canvas>
<canvas id="canvas-smile" width="256" height="256"></canvas>
<canvas id="canvas-angry" width="256" height="256"></canvas>

<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>

<script type="module">
import * as THREE from 'three';

let state = 'TITLE'; 
let score = 0;
const targets = [];
const video = document.createElement('video');
const faceTextures = [];

// --- Three.js 基本設定 ---
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

const videoTexture = new THREE.VideoTexture(video);
const bgScene = new THREE.Scene();
const bgCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
const bgMesh = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), new THREE.MeshBasicMaterial({ map: videoTexture }));
bgScene.add(bgMesh);

// --- 表情自動生成（1枚から3パターン作る） ---
function generateExpressions() {
    const base = document.getElementById('canvas-base');
    const smile = document.getElementById('canvas-smile');
    const angry = document.getElementById('canvas-angry');

    // 1. 通常顔
    faceTextures.push(new THREE.CanvasTexture(base));

    // 2. 笑顔加工 (口元を上に歪ませ、目を少し細める)
    const sCtx = smile.getContext('2d');
    sCtx.drawImage(base, 0, 0);
    sCtx.fillStyle = "rgba(255, 255, 0, 0.1)"; // 黄色っぽく
    sCtx.fillRect(0,0,256,256);
    // 簡易的な歪みとして、中央下（口）を拡大
    sCtx.drawImage(base, 64, 160, 128, 60, 50, 150, 156, 80); 
    faceTextures.push(new THREE.CanvasTexture(smile));

    // 3. 怒り顔加工 (全体を赤くし、目を吊り上げる)
    const aCtx = angry.getContext('2d');
    aCtx.drawImage(base, 0, 0);
    aCtx.fillStyle = "rgba(255, 0, 0, 0.3)";
    aCtx.fillRect(0,0,256,256);
    // 目のあたりを少し上にずらす
    aCtx.drawImage(base, 0, 80, 256, 60, 0, 70, 256, 60);
    faceTextures.push(new THREE.CanvasTexture(angry));
}

// --- 敵の出現 ---
function spawnEnemy() {
    const geometry = new THREE.SphereGeometry(1, 32, 32);
    const material = new THREE.MeshBasicMaterial({ map: faceTextures[0] });
    const mesh = new THREE.Mesh(geometry, material);
    
    // カメラの向きに合わせて全方位に配置
    const theta = Math.random() * Math.PI * 2;
    const phi = (Math.random() - 0.5) * Math.PI * 0.5;
    const dist = 8 + Math.random() * 4;
    
    mesh.position.setFromSphericalCoords(dist, phi + Math.PI/2, theta);
    mesh.lookAt(0, 0, 0);
    mesh.userData = { offset: Math.random() * 10 };
    
    scene.add(mesh);
    targets.push(mesh);
}

// --- UI・カメラ処理 ---
const btnMain = document.getElementById('btn-main');
const guide = document.getElementById('guide-wrap');
const overlay = document.getElementById('overlay');

btnMain.onclick = async () => {
    if (state === 'TITLE') {
        try {
            const s = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
            video.srcObject = s; video.play();
            state = 'SCAN';
            guide.style.display = 'block';
            btnMain.innerText = "撮影！";
        } catch(e) { alert("カメラが使えません"); }
    } else if (state === 'SCAN') {
        const canvas = document.getElementById('canvas-base');
        const ctx = canvas.getContext('2d');
        const size = Math.min(video.videoWidth, video.videoHeight) * 0.7;
        ctx.drawImage(video, (video.videoWidth-size)/2, (video.videoHeight-size)/2, size, size, 0, 0, 256, 256);
        generateExpressions();
        startGame();
    }
};

// テストモード（ダミー画像）
document.getElementById('test-mode').onclick = () => {
    const ctx = document.getElementById('canvas-base').getContext('2d');
    ctx.fillStyle = "gray"; ctx.fillRect(0,0,256,256);
    ctx.fillStyle = "white"; ctx.beginPath(); ctx.arc(80,100,20,0,7); ctx.arc(176,100,20,0,7); ctx.fill();
    ctx.strokeStyle = "white"; ctx.lineWidth=5; ctx.strokeRect(80,180,96,10);
    generateExpressions();
    startGame();
};

function startGame() {
    state = 'PLAY';
    overlay.style.display = 'none';
    document.getElementById('crosshair').style.display = 'block';
    document.getElementById('score-board').style.display = 'block';
    for(let i=0; i<6; i++) spawnEnemy();
    
    // 外向きカメラに切り替え試行
    navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
        .then(s => { video.srcObject = s; video.play(); });
}

// --- 視点操作 (PCマウス & ジャイロ統合) ---
let lon = 0, lat = 0;
document.addEventListener('mousemove', (e) => {
    if (state === 'PLAY') {
        lon -= e.movementX * 0.15;
        lat = Math.max(-85, Math.min(85, lat - e.movementY * 0.15));
    }
});

window.addEventListener('deviceorientation', (e) => {
    if (state === 'PLAY' && e.alpha) {
        // ジャイロ値をオフセットとして使用
        camera.rotation.y = THREE.MathUtils.degToRad(e.alpha);
        camera.rotation.x = THREE.MathUtils.degToRad(e.beta - 90);
    }
});

// --- ループ ---
function animate() {
    requestAnimationFrame(animate);
    if (state === 'PLAY') {
        // マウス視点の更新
        const phi = THREE.MathUtils.degToRad(90 - lat);
        const theta = THREE.MathUtils.degToRad(lon);
        camera.lookAt(new THREE.Vector3().setFromSphericalCoords(1, phi, theta));

        targets.forEach(t => {
            // 表情切り替えアニメーション
            const idx = Math.floor(Date.now() * 0.003 + t.userData.offset) % 3;
            t.material.map = faceTextures[idx];
            t.position.y += Math.sin(Date.now()*0.002 + t.userData.offset)*0.01;
            t.lookAt(camera.position);
        });
    }
    renderer.autoClear = false;
    renderer.clear();
    renderer.render(bgScene, bgCam);
    renderer.render(scene, camera);
}
animate();

window.onclick = () => {
    if (state !== 'PLAY') return;
    const ray = new THREE.Raycaster();
    ray.setFromCamera(new THREE.Vector2(0,0), camera);
    const hits = ray.intersectObjects(targets);
    if (hits.length > 0) {
        scene.remove(hits[0].object);
        targets.splice(targets.indexOf(hits[0].object), 1);
        score += 100;
        document.getElementById('score-board').innerText = `SCORE: ${score}`;
        setTimeout(spawnEnemy, 1500);
    }
};
</script>
</body>
</html>
