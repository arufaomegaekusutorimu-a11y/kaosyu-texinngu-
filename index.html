<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>顔シューティング -サバイバル版-</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: sans-serif; color: white; }
        #ui-layer { position: absolute; inset: 0; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(0,0,0,0.7); }
        #ui-layer.scanning { background: rgba(0,0,0,0.1); }
        #guide-wrap { 
            position: relative; width: 256px; height: 256px; 
            border: 5px solid #0f0; border-radius: 50%; 
            display: none; margin-bottom: 20px; box-sizing: border-box;
            box-shadow: 0 0 0 1000px rgba(0,0,0,0.5);
        }
        .eye-guide { position: absolute; width: 50px; height: 40px; border: 3px solid #00ffff; border-radius: 50%; top: 30%; }
        #mouth-guide { position: absolute; width: 80px; height: 10px; border-bottom: 5px solid #ff0055; bottom: 20%; left: 50%; transform: translateX(-50%); }
        .controls { display: flex; gap: 10px; flex-direction: column; align-items: center; }
        button { padding: 15px 35px; font-size: 1.2rem; cursor: pointer; background: #ff4400; color: white; border: none; border-radius: 50px; font-weight: bold; }
        #btn-flip { display: none; background: #444; font-size: 0.9rem; padding: 10px 20px; }
        
        /* 追加UI */
        #hud { position: absolute; top: 20px; left: 20px; display: none; z-index: 80; pointer-events: none; }
        #score-board { font-size: 24px; color: #0f0; font-weight: bold; margin-bottom: 5px; }
        #life-board { font-size: 28px; color: #ff0055; letter-spacing: 5px; }
        #damage-overlay { position: absolute; inset: 0; background: red; opacity: 0; pointer-events: none; z-index: 90; transition: opacity 0.1s; }
        #game-over { position: absolute; inset: 0; background: rgba(0,0,0,0.8); color: red; font-size: 40px; font-weight: bold; display: flex; align-items: center; justify-content: center; z-index: 200; display: none; flex-direction: column; }
        
        #crosshair { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 30px; height: 30px; border: 2px solid #fff; border-radius: 50%; display: none; pointer-events: none; }
        canvas { display: none; }
    </style>
</head>
<body>

<div id="ui-layer">
    <h1>顔シューティング</h1>
    <div id="guide-wrap">
        <div class="eye-guide" style="left: 15%;"></div>
        <div class="eye-guide" style="right: 15%;"></div>
        <div id="mouth-guide"></div>
    </div>
    <div class="controls">
        <p id="msg">円の中に顔を入れて撮影！</p>
        <button id="btn-main">カメラを起動</button>
        <button id="btn-flip">カメラ切替</button>
    </div>
</div>

<div id="hud">
    <div id="score-board">SCORE: 0</div>
    <div id="life-board">♥♥♥</div>
</div>
<div id="damage-overlay"></div>
<div id="game-over">
    <div>GAME OVER</div>
    <button onclick="location.reload()" style="margin-top: 20px; font-size: 1rem;">もう一度遊ぶ</button>
</div>
<div id="crosshair"></div>

<canvas id="canv-base" width="256" height="256"></canvas>
<canvas id="canv-smile" width="256" height="256"></canvas>
<canvas id="canv-angry" width="256" height="256"></canvas>

<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>

<script type="module">
import * as THREE from 'three';

let state = 'TITLE', score = 0, hp = 3, isGyroActive = false, currentFacingMode = "user", stream = null;
const targets = [], bullets = [], particles = [], faceTextures = [];
const video = document.createElement('video');
video.setAttribute('playsinline', '');
let lon = 0, lat = 0;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

const videoTexture = new THREE.VideoTexture(video);
const bgScene = new THREE.Scene();
const bgCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
const bgMesh = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), new THREE.MeshBasicMaterial({ map: videoTexture, depthTest: false, depthWrite: false }));
bgScene.add(bgMesh);

async function setupCamera(mode) {
    if (stream) stream.getTracks().forEach(t => t.stop());
    currentFacingMode = mode;
    try {
        stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: mode, width: 1280, height: 720 } });
        video.srcObject = stream;
        await video.play();
    } catch(e) { alert("カメラが起動できません"); }
}

function processFace(ctx, sourceCanvas) {
    ctx.clearRect(0, 0, 256, 256);
    ctx.save();
    ctx.beginPath();
    ctx.arc(128, 128, 120, 0, Math.PI * 2);
    ctx.clip();
    ctx.drawImage(sourceCanvas, 0, 0);
    ctx.restore();
}

function makeFaces(base) {
    faceTextures.forEach(t => t.dispose());
    faceTextures.length = 0;
    const createTex = (id, modifierFn) => {
        const c = document.getElementById(id);
        const ctx = c.getContext('2d');
        processFace(ctx, base);
        if (modifierFn) modifierFn(ctx);
        const tex = new THREE.CanvasTexture(c);
        tex.colorSpace = THREE.SRGBColorSpace;
        return tex;
    };
    faceTextures.push(createTex('canv-base'));
    faceTextures.push(createTex('canv-smile', (ctx) => {
        ctx.save(); ctx.beginPath(); ctx.arc(128, 128, 120, 0, Math.PI * 2); ctx.clip();
        ctx.fillStyle = "rgba(255,255,0,0.1)"; ctx.fillRect(0,0,256,256);
        ctx.drawImage(base, 60, 160, 136, 60, 40, 155, 176, 75); ctx.restore();
    }));
    faceTextures.push(createTex('canv-angry', (ctx) => {
        ctx.save(); ctx.beginPath(); ctx.arc(128, 128, 120, 0, Math.PI * 2); ctx.clip();
        ctx.fillStyle = "rgba(255,0,0,0.2)"; ctx.fillRect(0,0,256,256);
        ctx.save(); ctx.translate(80, 100); ctx.rotate(0.2); ctx.drawImage(base, 50, 70, 70, 60, -35, -30, 70, 60); ctx.restore();
        ctx.save(); ctx.translate(176, 100); ctx.rotate(-0.2); ctx.drawImage(base, 140, 70, 70, 60, -35, -30, 70, 60); ctx.restore();
        ctx.restore();
    }));
}

function spawn(first = false) {
    if (state !== 'PLAY') return;
    const material = new THREE.SpriteMaterial({ map: faceTextures[0], transparent: true, alphaTest: 0.5 });
    const sprite = new THREE.Sprite(material);
    sprite.scale.set(3, 3, 1);

    if (first) sprite.position.set(0, 0, -15);
    else {
        const t = Math.random() * Math.PI * 2, p = (Math.random() - 0.5) * Math.PI * 0.6;
        sprite.position.setFromSphericalCoords(15, p + Math.PI/2, t);
    }
    
    // スピードと揺らぎのシード値を持たせる
    sprite.userData = { offset: Math.random() * 10, speed: 0.02 + Math.random() * 0.03 };
    scene.add(sprite);
    targets.push(sprite);
}

// 破片生成関数（紙吹雪のような2Dポリゴン）
function createExplosion(pos) {
    for (let i = 0; i < 15; i++) {
        // 三角形か四角形をランダム生成
        const geom = Math.random() > 0.5 ? new THREE.CircleGeometry(0.4, 3) : new THREE.PlaneGeometry(0.5, 0.5);
        const mat = new THREE.MeshBasicMaterial({ 
            map: faceTextures[Math.floor(Math.random() * 3)], 
            transparent: true, side: THREE.DoubleSide, alphaTest: 0.1 
        });
        const p = new THREE.Mesh(geom, mat);
        p.position.copy(pos);
        // ランダムな方向に吹き飛ばす
        p.userData = {
            velocity: new THREE.Vector3((Math.random() - 0.5) * 0.8, (Math.random() - 0.5) * 0.8, (Math.random() - 0.5) * 0.8),
            rotSpeed: new THREE.Vector3(Math.random() * 0.2, Math.random() * 0.2, Math.random() * 0.2)
        };
        scene.add(p);
        particles.push(p);
    }
}

// ダメージ処理
function takeDamage() {
    if (hp <= 0) return;
    hp--;
    document.getElementById('life-board').innerText = '♥'.repeat(hp) + '♡'.repeat(3 - hp);
    
    // 画面を赤くフラッシュ
    const overlay = document.getElementById('damage-overlay');
    overlay.style.opacity = 0.5;
    setTimeout(() => { overlay.style.opacity = 0; }, 100);

    if (hp <= 0) {
        state = 'GAMEOVER';
        document.getElementById('game-over').style.display = 'flex';
        document.getElementById('crosshair').style.display = 'none';
    }
}

const btnMain = document.getElementById('btn-main');
const btnFlip = document.getElementById('btn-flip');

btnMain.onclick = async () => {
    if (state === 'TITLE') {
        await setupCamera("user");
        state = 'SCAN';
        document.getElementById('ui-layer').classList.add('scanning');
        document.getElementById('guide-wrap').style.display = 'block';
        btnFlip.style.display = 'block';
        btnMain.innerText = "撮影！";
    } else if (state === 'SCAN') {
        const tempCanv = document.createElement('canvas');
        tempCanv.width = 256; tempCanv.height = 256;
        const tCtx = tempCanv.getContext('2d');
        const size = Math.min(video.videoWidth, video.videoHeight);
        const sx = (video.videoWidth - size) / 2, sy = (video.videoHeight - size) / 2;

        if (currentFacingMode === "user") { tCtx.translate(256, 0); tCtx.scale(-1, 1); }
        tCtx.drawImage(video, sx, sy, size, size, 0, 0, 256, 256);
        
        makeFaces(tempCanv);
        start();
    }
};

btnFlip.onclick = () => setupCamera(currentFacingMode === "user" ? "environment" : "user");

function start() {
    state = 'PLAY';
    document.getElementById('ui-layer').style.display = 'none';
    document.getElementById('crosshair').style.display = 'block';
    document.getElementById('hud').style.display = 'block';
    spawn(true); spawn(); spawn();
    setupCamera("environment");
}

function animate() {
    requestAnimationFrame(animate);
    
    if (state === 'PLAY') {
        // 敵の挙動更新
        for (let i = targets.length - 1; i >= 0; i--) {
            const t = targets[i];
            const mood = Math.floor(Date.now() * 0.002 + t.userData.offset) % 3;
            t.material.map = faceTextures[mood];
            
            // カメラ（原点）に向かって移動させる
            const dir = new THREE.Vector3().subVectors(camera.position, t.position).normalize();
            t.position.add(dir.multiplyScalar(t.userData.speed));

            // カメラに近づきすぎたらダメージ処理
            if (t.position.distanceTo(camera.position) < 2.0) {
                scene.remove(t); targets.splice(i, 1);
                takeDamage();
                setTimeout(spawn, 1000); // 新しい敵を補充
            }
        }

        // 弾の当たり判定
        for (let i = bullets.length - 1; i >= 0; i--) {
            const b = bullets[i];
            b.position.add(b.userData.velocity);
            
            // 弾が遠くに行き過ぎたら消す
            if (b.position.length() > 30) {
                scene.remove(b); bullets.splice(i, 1);
                continue;
            }

            for (let j = targets.length - 1; j >= 0; j--) {
                const t = targets[j];
                if (b.position.distanceTo(t.position) < 1.5) {
                    // 破片エフェクト生成
                    createExplosion(t.position);
                    
                    scene.remove(t); targets.splice(j, 1);
                    scene.remove(b); bullets.splice(i, 1);
                    score += 100; document.getElementById('score-board').innerText = `SCORE: ${score}`;
                    setTimeout(spawn, 1000);
                    break;
                }
            }
        }

        // ジャイロがなければマウスでカメラ操作
        if (!isGyroActive) {
            const phi = THREE.MathUtils.degToRad(90 - lat);
            const theta = THREE.MathUtils.degToRad(lon);
            camera.lookAt(new THREE.Vector3().setFromSphericalCoords(1, phi, theta));
        }
    }

    // パーティクルの更新（ゲームオーバー後も破片は散らせるように外に出す）
    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.position.add(p.userData.velocity);
        p.rotation.x += p.userData.rotSpeed.x;
        p.rotation.y += p.userData.rotSpeed.y;
        p.material.opacity -= 0.02; // 徐々に消える
        
        // 重力を少し加える
        p.userData.velocity.y -= 0.02;

        if (p.material.opacity <= 0) {
            scene.remove(p); particles.splice(i, 1);
        }
    }

    renderer.autoClear = false;
    renderer.clear();
    renderer.render(bgScene, bgCam);
    renderer.clearDepth();
    renderer.render(scene, camera);
}
animate();

document.addEventListener('mousemove', (e) => { if(state==='PLAY'){ lon -= e.movementX*0.1; lat = Math.max(-85, Math.min(85, lat-e.movementY*0.1)); } });
window.addEventListener('deviceorientation', (e) => { if(state==='PLAY' && e.alpha){ isGyroActive=true; camera.rotation.set(THREE.MathUtils.degToRad(e.beta-90), THREE.MathUtils.degToRad(e.alpha), THREE.MathUtils.degToRad(e.gamma), 'YXZ'); } }, true);
window.addEventListener('pointerdown', (e) => {
    if (state !== 'PLAY' || e.target.tagName === 'BUTTON') return;
    const b = new THREE.Mesh(new THREE.SphereGeometry(0.2), new THREE.MeshBasicMaterial({ color: 0xffff00 }));
    b.position.copy(camera.position);
    const dir = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
    b.userData.velocity = dir.multiplyScalar(1.0);
    scene.add(b); bullets.push(b);
});
</script>
</body>
</html>
