<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>顔シューティング -カメラ改善版-</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: sans-serif; color: white; }
        
        /* UIレイヤー: 撮影中は背景を少し明るく(0.4)設定 */
        #ui-layer { 
            position: absolute; inset: 0; z-index: 100; 
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            background: rgba(0,0,0,0.7); /* 少し薄くしました */
            transition: background 0.3s;
        }
        #ui-layer.scanning { background: rgba(0,0,0,0.3); } /* 撮影中はもっと薄く */

        #guide-wrap { 
            position: relative; width: 240px; height: 280px; 
            border: 4px solid #0f0; border-radius: 50% 50% 40% 40%; 
            display: none; margin-bottom: 20px; box-shadow: 0 0 20px rgba(0,255,0,0.5);
        }

        .controls { display: flex; gap: 10px; flex-direction: column; align-items: center; }
        
        button { 
            padding: 15px 35px; font-size: 1.2rem; cursor: pointer; 
            background: #ff4400; color: white; border: none; border-radius: 50px; 
            font-weight: bold; box-shadow: 0 4px #992200;
        }
        button:active { transform: translateY(2px); box-shadow: none; }
        
        /* カメラ切り替えボタン */
        #btn-flip { 
            display: none; background: #444; font-size: 0.9rem; padding: 10px 20px; margin-top: 10px;
        }

        #crosshair { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 30px; height: 30px; border: 2px solid #fff; border-radius: 50%; display: none; z-index: 50; pointer-events: none; }
        #score-board { position: absolute; top: 20px; left: 20px; font-size: 24px; color: #0f0; display: none; z-index: 80; font-weight: bold; }
        #enemy-arrow { position: absolute; top: 50%; left: 50%; width: 100px; height: 100px; margin: -50px; pointer-events: none; display: none; z-index: 60; }
        .arrow-graphic { width: 0; height: 0; border-left: 15px solid transparent; border-right: 15px solid transparent; border-bottom: 30px solid yellow; position: absolute; left: 35px; top: -60px; }
        
        canvas { display: none; }
    </style>
</head>
<body>

<div id="ui-layer">
    <h1 id="title">顔シューティング</h1>
    <div id="guide-wrap"></div>
    <div class="controls">
        <p id="msg">カメラを許可して顔を撮ってください</p>
        <button id="btn-main">カメラを起動</button>
        <button id="btn-flip">カメラを切り替える</button>
        <p id="btn-test" style="cursor:pointer; text-decoration:underline; margin-top:20px; opacity:0.6;">テストモード</p>
    </div>
</div>

<div id="score-board">SCORE: 0</div>
<div id="crosshair"></div>
<div id="enemy-arrow"><div class="arrow-graphic"></div></div>

<canvas id="canv-base" width="256" height="256"></canvas>
<canvas id="canv-smile" width="256" height="256"></canvas>
<canvas id="canv-angry" width="256" height="256"></canvas>

<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>

<script type="module">
import * as THREE from 'three';

let state = 'TITLE';
let score = 0;
let isGyroActive = false;
let currentFacingMode = "user"; // "user" or "environment"
let stream = null;

const targets = [];
const bullets = [];
const video = document.createElement('video');
video.setAttribute('playsinline', ''); // iOS対策
const faceTextures = [];
let lon = 0, lat = 0;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

const videoTexture = new THREE.VideoTexture(video);
const bgScene = new THREE.Scene();
const bgCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
const bgMesh = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), new THREE.MeshBasicMaterial({ map: videoTexture, depthTest: false, depthWrite: false }));
bgScene.add(bgMesh);

// カメラ起動・切り替え関数
async function setupCamera(mode) {
    if (stream) stream.getTracks().forEach(track => track.stop());
    try {
        currentFacingMode = mode;
        stream = await navigator.mediaDevices.getUserMedia({ 
            video: { facingMode: currentFacingMode, width: 1280, height: 720 } 
        });
        video.srcObject = stream;
        await video.play();
    } catch (e) {
        alert("カメラの起動に失敗しました。設定を確認してください。");
    }
}

function makeFaces(base) {
    faceTextures.length = 0;
    faceTextures.push(new THREE.CanvasTexture(base));
    
    // 表情を自動生成
    [ {id:'canv-smile', color: "rgba(255,255,0,0.2)"}, {id:'canv-angry', color: "rgba(255,0,0,0.3)"} ].forEach(obj => {
        const c = document.getElementById(obj.id);
        const ctx = c.getContext('2d');
        ctx.drawImage(base, 0, 0);
        ctx.fillStyle = obj.color;
        ctx.fillRect(0,0,256,256);
        faceTextures.push(new THREE.CanvasTexture(c));
    });
}

function spawn(first = false) {
    const mesh = new THREE.Mesh(new THREE.SphereGeometry(1.5, 32, 32), new THREE.MeshBasicMaterial({ map: faceTextures[0] }));
    if (first) mesh.position.set(0, 0, -10);
    else {
        const t = Math.random() * Math.PI * 2, p = (Math.random() - 0.5) * Math.PI * 0.6;
        mesh.position.setFromSphericalCoords(12, p + Math.PI/2, t);
    }
    mesh.userData = { offset: Math.random() * 10 };
    scene.add(mesh);
    targets.push(mesh);
}

const btnMain = document.getElementById('btn-main');
const btnFlip = document.getElementById('btn-flip');
const uiLayer = document.getElementById('ui-layer');

btnMain.onclick = async () => {
    // iOS用センサー許可
    if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
        try { await DeviceOrientationEvent.requestPermission(); } catch(e){}
    }

    if (state === 'TITLE') {
        await setupCamera("user"); // 最初は内カメラ
        state = 'SCAN';
        uiLayer.classList.add('scanning');
        document.getElementById('guide-wrap').style.display = 'block';
        btnFlip.style.display = 'block';
        btnMain.innerText = "撮影！";
    } else if (state === 'SCAN') {
        const canv = document.getElementById('canv-base');
        const ctx = canv.getContext('2d');
        // カメラの向きに合わせて反転を制御
        if (currentFacingMode === "user") {
            ctx.translate(256, 0); ctx.scale(-1, 1);
        }
        const size = Math.min(video.videoWidth, video.videoHeight);
        ctx.drawImage(video, (video.videoWidth-size)/2, (video.videoHeight-size)/2, size, size, 0, 0, 256, 256);
        makeFaces(canv);
        start();
    }
};

// カメラ切り替え
btnFlip.onclick = async () => {
    const nextMode = (currentFacingMode === "user") ? "environment" : "user";
    await setupCamera(nextMode);
};

document.getElementById('btn-test').onclick = () => {
    const canv = document.getElementById('canv-base');
    const ctx = canv.getContext('2d');
    ctx.fillStyle = "blue"; ctx.fillRect(0,0,256,256);
    makeFaces(canv);
    start();
};

function start() {
    state = 'PLAY';
    uiLayer.style.display = 'none';
    document.getElementById('crosshair').style.display = 'block';
    document.getElementById('score-board').style.display = 'block';
    document.getElementById('enemy-arrow').style.display = 'block';
    spawn(true); spawn(); spawn();
    // ゲーム開始時は外カメラを優先
    setupCamera("environment");
}

document.addEventListener('mousemove', (e) => {
    if (state === 'PLAY') {
        lon -= e.movementX * 0.15;
        lat = Math.max(-85, Math.min(85, lat - e.movementY * 0.15));
    }
});

window.addEventListener('deviceorientation', (e) => {
    if (state === 'PLAY' && e.alpha !== null && e.alpha !== 0) {
        isGyroActive = true;
        camera.rotation.set(THREE.MathUtils.degToRad(e.beta - 90), THREE.MathUtils.degToRad(e.alpha), THREE.MathUtils.degToRad(e.gamma), 'YXZ');
    }
}, true);

window.addEventListener('pointerdown', (e) => {
    if (state !== 'PLAY' || e.target.tagName === 'BUTTON') return;
    const b = new THREE.Mesh(new THREE.SphereGeometry(0.3), new THREE.MeshBasicMaterial({ color: 0xffff00 }));
    b.position.copy(camera.position);
    const dir = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
    b.userData.velocity = dir.multiplyScalar(1.2);
    scene.add(b); bullets.push(b);
});

function animate() {
    requestAnimationFrame(animate);
    if (state === 'PLAY') {
        if (!isGyroActive) {
            const phi = THREE.MathUtils.degToRad(90 - lat);
            const theta = THREE.MathUtils.degToRad(lon);
            camera.lookAt(new THREE.Vector3().setFromSphericalCoords(1, phi, theta));
        }

        let nearest = null;
        targets.forEach(t => {
            const idx = Math.floor(Date.now() * 0.006 + t.userData.offset) % 3;
            t.material.map = faceTextures[idx];
            t.lookAt(camera.position);
            const v = t.position.clone().project(camera);
            if (v.z > 1 || Math.abs(v.x) > 0.8 || Math.abs(v.y) > 0.8) nearest = v;
        });

        const arrow = document.getElementById('enemy-arrow');
        if (nearest && targets.length > 0) {
            arrow.style.display = 'block';
            arrow.style.transform = `rotate(${Math.atan2(nearest.x, nearest.y)}rad)`;
        } else { arrow.style.display = 'none'; }

        for (let i = bullets.length - 1; i >= 0; i--) {
            const b = bullets[i]; b.position.add(b.userData.velocity);
            for (let j = targets.length - 1; j >= 0; j--) {
                const t = targets[j];
                if (b.position.distanceTo(t.position) < 2) {
                    scene.remove(t); targets.splice(j, 1);
                    scene.remove(b); bullets.splice(i, 1);
                    score += 100; document.getElementById('score-board').innerText = `SCORE: ${score}`;
                    setTimeout(spawn, 2000); break;
                }
            }
        }
    }
    renderer.autoClear = false;
    renderer.clear();
    renderer.render(bgScene, bgCam);
    renderer.clearDepth();
    renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
