<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>低予算顔シューティング -ガイド撮影版-</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: sans-serif; color: white; }
        #overlay { position: absolute; inset: 0; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(0,0,0,0.7); }
        
        /* 撮影ガイド */
        #guide-container { position: relative; width: 280px; height: 320px; border: 2px dashed #0f0; border-radius: 50% 50% 40% 40%; display: none; margin-bottom: 20px; }
        .eye-guide { position: absolute; width: 40px; height: 20px; border-bottom: 3px solid #0f0; top: 120px; }
        #eye-l { left: 60px; } #eye-r { right: 60px; }
        #mouth-guide { position: absolute; width: 60px; height: 30px; border: 3px solid #0f0; border-top: none; border-radius: 0 0 30px 30px; bottom: 60px; left: 50%; transform: translateX(-50%); }

        .ui-box { text-align: center; pointer-events: auto; }
        button { padding: 15px 30px; font-size: 1.2rem; cursor: pointer; background: #00ff00; border: none; border-radius: 50px; font-weight: bold; margin: 10px; }
        #crosshair { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 30px; height: 30px; border: 2px solid red; border-radius: 50%; display: none; z-index: 50; }
        #score-board { position: absolute; top: 20px; left: 20px; font-size: 24px; color: yellow; display: none; z-index: 80; }
        canvas#faceCapture { display: none; }
    </style>
</head>
<body>

<div id="overlay">
    <h1 id="title">低予算顔シューティング</h1>
    
    <div id="guide-container">
        <div id="eye-l" class="eye-guide"></div>
        <div id="eye-r" class="eye-guide"></div>
        <div id="mouth-guide"></div>
    </div>

    <div class="ui-box">
        <p id="status-msg">カメラを起動して顔を撮影しよう！</p>
        <button id="btn-action">カメラ起動</button>
    </div>
</div>

<div id="score-board">SCORE: 0</div>
<div id="crosshair"></div>
<canvas id="faceCapture" width="256" height="256"></canvas>

<script type="importmap">
{
    "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" }
}
</script>

<script type="module">
import * as THREE from 'three';

let state = 'TITLE'; 
let score = 0;
const targets = [];
const video = document.createElement('video');
const faceCanvas = document.getElementById('faceCapture');
const faceCtx = faceCanvas.getContext('2d');

// --- Three.js 背景設定 ---
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

const videoTexture = new THREE.VideoTexture(video);
const bgScene = new THREE.Scene();
const bgCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
const bgMesh = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), new THREE.MeshBasicMaterial({ map: videoTexture }));
bgScene.add(bgMesh);

// --- 敵の作成 ---
function spawnEnemy(texture) {
    const geometry = new THREE.SphereGeometry(1, 32, 32);
    const material = new THREE.MeshBasicMaterial({ map: texture });
    const mesh = new THREE.Mesh(geometry, material);
    
    const angle = Math.random() * Math.PI * 2;
    mesh.position.set(Math.cos(angle) * 8, (Math.random()-0.5)*6, Math.sin(angle) * 8);
    mesh.lookAt(0, 0, 0);
    scene.add(mesh);
    targets.push(mesh);
}

// --- UI操作 ---
const btnAction = document.getElementById('btn-action');
const statusMsg = document.getElementById('status-msg');
const guide = document.getElementById('guide-container');
const overlay = document.getElementById('overlay');

btnAction.onclick = async () => {
    if (state === 'TITLE') {
        const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } }); // 撮影は内カメラ
        video.srcObject = stream;
        video.play();
        state = 'SCAN';
        btnAction.innerText = "撮影！";
        statusMsg.innerText = "枠の中に顔をあわせてね";
        guide.style.display = 'block';
    } 
    else if (state === 'SCAN') {
        captureFace();
    }
    else if (state === 'READY') {
        startGame();
    }
};

function captureFace() {
    // 画面中央の部分を切り抜く (256x256)
    const size = Math.min(video.videoWidth, video.videoHeight) * 0.6;
    const startX = (video.videoWidth - size) / 2;
    const startY = (video.videoHeight - size) / 2;

    faceCtx.drawImage(video, startX, startY, size, size, 0, 0, 256, 256);
    
    // 不敵な笑み演出（赤く染める）
    faceCtx.fillStyle = "rgba(255, 0, 0, 0.2)";
    faceCtx.fillRect(0,0,256,256);

    state = 'READY';
    guide.style.display = 'none';
    statusMsg.innerHTML = `<img src="${faceCanvas.toDataURL()}" style="border-radius:50%; width:150px; border:4px solid red;"><br>敵が完成した！`;
    btnAction.innerText = "ゲームスタート！";
}

async function startGame() {
    // ゲーム開始時に外カメラに切り替え（もしあれば）
    try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
        video.srcObject = stream;
        video.play();
    } catch(e) {}

    state = 'PLAY';
    overlay.style.display = 'none';
    document.getElementById('crosshair').style.display = 'block';
    document.getElementById('score-board').style.display = 'block';

    const tex = new THREE.CanvasTexture(faceCanvas);
    for(let i=0; i<6; i++) spawnEnemy(tex);
}

// --- PCマウス視点移動 ---
let lon = 0, lat = 0;
document.addEventListener('mousemove', (e) => {
    if (state !== 'PLAY') return;
    lon -= e.movementX * 0.15;
    lat = Math.max(-85, Math.min(85, lat + e.movementY * 0.15));
});

// --- スマホジャイロ ---
window.addEventListener('deviceorientation', (e) => {
    if (state === 'PLAY' && e.alpha) {
        camera.rotation.y = THREE.MathUtils.degToRad(e.alpha);
        camera.rotation.x = THREE.MathUtils.degToRad(e.beta - 90);
    }
});

// --- 射撃 ---
window.onclick = () => {
    if (state !== 'PLAY') return;
    const raycaster = new THREE.Raycaster();
    raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
    const intersects = raycaster.intersectObjects(targets);
    if (intersects.length > 0) {
        const hit = intersects[0].object;
        scene.remove(hit);
        targets.splice(targets.indexOf(hit), 1);
        score += 100;
        document.getElementById('score-board').innerText = `SCORE: ${score}`;
        spawnEnemy(new THREE.CanvasTexture(faceCanvas));
    }
};

// --- アニメーション ---
function animate() {
    requestAnimationFrame(animate);
    if (state === 'PLAY') {
        const phi = THREE.MathUtils.degToRad(90 - lat);
        const theta = THREE.MathUtils.degToRad(lon);
        const target = new THREE.Vector3().setFromSphericalCoords(1, phi, theta);
        camera.lookAt(target);

        targets.forEach(t => {
            t.position.y += Math.sin(Date.now() * 0.003 + t.id) * 0.02;
            t.rotateY(0.02); // 敵がくるくる回る
        });
    }
    renderer.autoClear = false;
    renderer.clear();
    renderer.render(bgScene, bgCam);
    renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
