<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>顔シューティング -弾発射版-</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: sans-serif; color: white; }
        #overlay { position: absolute; inset: 0; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(0,0,0,0.8); text-align: center; }
        
        #guide-wrap { position: relative; width: 240px; height: 240px; border: 4px solid #0f0; border-radius: 50%; display: none; margin-bottom: 20px; }
        .guide-line { position: absolute; background: rgba(0,255,0,0.5); height: 2px; width: 40px; top: 40%; }
        
        button { padding: 15px 40px; font-size: 1.5rem; cursor: pointer; background: #ff4400; color: white; border: none; border-radius: 50px; font-weight: bold; }
        
        #crosshair { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 30px; height: 30px; border: 2px solid rgba(255,255,255,0.5); border-radius: 50%; display: none; z-index: 50; pointer-events: none; }
        #crosshair::after { content: ''; position: absolute; top: 50%; left: 50%; width: 4px; height: 4px; background: red; transform: translate(-50%, -50%); border-radius: 50%; }
        
        #score-board { position: absolute; top: 20px; left: 20px; font-size: 24px; color: #0f0; display: none; z-index: 80; text-shadow: 2px 2px 4px #000; }
        #enemy-guide { position: absolute; top: 50%; left: 50%; width: 100px; height: 100px; margin-left: -50px; margin-top: -50px; pointer-events: none; display: none; z-index: 60; }
        .arrow { position: absolute; width: 0; height: 0; border-left: 15px solid transparent; border-right: 15px solid transparent; border-bottom: 30px solid yellow; left: 35px; top: -60px; }
    </style>
</head>
<body>

<div id="overlay">
    <h1>顔シューティング</h1>
    <div id="guide-wrap">
        <div class="guide-line" style="left:15%"></div>
        <div class="guide-line" style="right:15%"></div>
        <div style="position:absolute; bottom:25%; left:50%; transform:translateX(-50%); width:60px; height:2px; background:rgba(0,255,0,0.5);"></div>
    </div>
    <div class="ui-box">
        <p id="status-msg">クリックで弾を発射して敵を倒せ！</p>
        <button id="btn-main">カメラ起動</button>
        <p id="test-mode" style="text-decoration:underline; cursor:pointer; margin-top:20px;">カメラなしでテスト</p>
    </div>
</div>

<div id="score-board">SCORE: 0</div>
<div id="crosshair"></div>
<div id="enemy-guide"><div class="arrow"></div></div>

<canvas id="canvas-base" width="256" height="256" style="display:none;"></canvas>
<canvas id="canvas-smile" width="256" height="256" style="display:none;"></canvas>
<canvas id="canvas-angry" width="256" height="256" style="display:none;"></canvas>

<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>

<script type="module">
import * as THREE from 'three';

let state = 'TITLE';
let score = 0;
const targets = [];
const bullets = []; // 弾を管理する配列
const video = document.createElement('video');
const faceTextures = [];

// --- Three.js 基本設定 ---
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

// 背景シーン (深度を無視して一番奥に描画させる)
const videoTexture = new THREE.VideoTexture(video);
const bgScene = new THREE.Scene();
const bgCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
const bgMesh = new THREE.Mesh(
    new THREE.PlaneGeometry(2, 2), 
    new THREE.MeshBasicMaterial({ map: videoTexture, depthTest: false, depthWrite: false }) // 奥に固定
);
bgScene.add(bgMesh);

// --- 表情生成 ---
function generateExpressions(sourceCanvas) {
    faceTextures.length = 0;
    const base = sourceCanvas;
    faceTextures.push(new THREE.CanvasTexture(base));

    const smile = document.getElementById('canvas-smile');
    const sCtx = smile.getContext('2d');
    sCtx.drawImage(base, 0, 0);
    sCtx.fillStyle = "rgba(255, 255, 0, 0.2)"; sCtx.fillRect(0,0,256,256);
    faceTextures.push(new THREE.CanvasTexture(smile));

    const angry = document.getElementById('canvas-angry');
    const aCtx = angry.getContext('2d');
    aCtx.drawImage(base, 0, 0);
    aCtx.fillStyle = "rgba(255, 0, 0, 0.4)"; aCtx.fillRect(0,0,256,256);
    faceTextures.push(new THREE.CanvasTexture(angry));
}

// --- 敵の出現 ---
function spawnEnemy(isFirst = false) {
    const geometry = new THREE.SphereGeometry(1.5, 32, 32);
    const material = new THREE.MeshBasicMaterial({ map: faceTextures[0] });
    const mesh = new THREE.Mesh(geometry, material);
    
    if (isFirst) {
        mesh.position.set(0, 0, -8); // 確実に目の前
    } else {
        const theta = Math.random() * Math.PI * 2;
        const phi = (Math.random() - 0.5) * Math.PI * 0.5;
        mesh.position.setFromSphericalCoords(10 + Math.random() * 5, phi + Math.PI/2, theta);
    }
    
    mesh.lookAt(0, 0, 0);
    mesh.userData = { offset: Math.random() * 10 };
    scene.add(mesh);
    targets.push(mesh);
}

// --- UI / カメラ制御 ---
const btnMain = document.getElementById('btn-main');
const guideWrap = document.getElementById('guide-wrap');
const overlay = document.getElementById('overlay');

btnMain.onclick = async () => {
    if (state === 'TITLE') {
        try {
            const s = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
            video.srcObject = s; video.play();
            state = 'SCAN';
            guideWrap.style.display = 'block';
            btnMain.innerText = "撮影！";
        } catch(e) { alert("カメラが起動できません。"); }
    } else if (state === 'SCAN') {
        const canvas = document.getElementById('canvas-base');
        const ctx = canvas.getContext('2d');
        const size = Math.min(video.videoWidth, video.videoHeight) * 0.7;
        ctx.drawImage(video, (video.videoWidth-size)/2, (video.videoHeight-size)/2, size, size, 0, 0, 256, 256);
        generateExpressions(canvas);
        startGame();
    }
};

document.getElementById('test-mode').onclick = () => {
    const canvas = document.getElementById('canvas-base');
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = "blue"; ctx.fillRect(0,0,256,256);
    ctx.fillStyle = "white"; ctx.fillRect(60,80,30,30); ctx.fillRect(160,80,30,30);
    ctx.fillRect(80,180,100,20);
    generateExpressions(canvas);
    startGame();
};

function startGame() {
    state = 'PLAY';
    overlay.style.display = 'none';
    document.getElementById('crosshair').style.display = 'block';
    document.getElementById('score-board').style.display = 'block';
    
    spawnEnemy(true); 
    for(let i=0; i<3; i++) spawnEnemy(false);

    navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
        .then(s => { video.srcObject = s; video.play(); }).catch(()=>{});
}

// --- 視点操作 ---
let lon = 0, lat = 0;
document.addEventListener('mousemove', (e) => {
    if (state === 'PLAY') {
        lon -= e.movementX * 0.2;
        lat = Math.max(-85, Math.min(85, lat - e.movementY * 0.2));
    }
});

// --- 弾の発射 ---
window.onclick = () => {
    if (state !== 'PLAY') return;
    
    // 黄色い光る弾を作成
    const bullet = new THREE.Mesh(
        new THREE.SphereGeometry(0.3, 8, 8),
        new THREE.MeshBasicMaterial({ color: 0xffff00 })
    );
    
    // カメラの位置からスタート
    bullet.position.copy(camera.position);
    
    // カメラの向いている方向（前）を計算
    const direction = new THREE.Vector3(0, 0, -1);
    direction.applyQuaternion(camera.quaternion);
    
    // 弾の飛ぶスピード
    bullet.userData.velocity = direction.multiplyScalar(2.0); 
    
    scene.add(bullet);
    bullets.push(bullet);
};

// --- メインループ ---
function animate() {
    requestAnimationFrame(animate);
    if (state === 'PLAY') {
        const phi = THREE.MathUtils.degToRad(90 - lat);
        const theta = THREE.MathUtils.degToRad(lon);
        camera.lookAt(new THREE.Vector3().setFromSphericalCoords(1, phi, theta));

        let nearestEnemy = null;

        // 敵のアニメーション
        targets.forEach(t => {
            const idx = Math.floor(Date.now() * 0.005 + t.userData.offset) % 3;
            t.material.map = faceTextures[idx];
            t.lookAt(camera.position);

            const vector = t.position.clone().project(camera);
            if (vector.z < 1) { 
                if (vector.x < -1 || vector.x > 1 || vector.y < -1 || vector.y > 1) nearestEnemy = vector;
            } else { 
                nearestEnemy = vector;
            }
        });

        // 矢印ガイド
        const guideEl = document.getElementById('enemy-guide');
        if (nearestEnemy && targets.length > 0) {
            guideEl.style.display = 'block';
            const angle = Math.atan2(nearestEnemy.y, nearestEnemy.x);
            guideEl.style.transform = `rotate(${angle + Math.PI/2}rad) translate(0, -120px)`;
        } else {
            guideEl.style.display = 'none';
        }

        // 弾の移動と当たり判定
        for (let i = bullets.length - 1; i >= 0; i--) {
            const b = bullets[i];
            b.position.add(b.userData.velocity); // 弾を前に進める

            let hit = false;
            // 敵と弾の距離をチェック
            for (let j = targets.length - 1; j >= 0; j--) {
                const t = targets[j];
                // 弾と敵の距離が2.0以内なら命中
                if (b.position.distanceTo(t.position) < 2.0) {
                    scene.remove(t);
                    targets.splice(j, 1);
                    hit = true;
                    score += 100;
                    document.getElementById('score-board').innerText = `SCORE: ${score}`;
                    setTimeout(() => spawnEnemy(false), 2000); // 2秒後に新しい敵を補充
                    break;
                }
            }

            // 命中した、または遠くへ飛びすぎた弾を消す
            if (hit || b.position.distanceTo(camera.position) > 100) {
                scene.remove(b);
                bullets.splice(i, 1);
            }
        }
    }

    renderer.autoClear = false;
    renderer.clear();
    // 1. 背景を描画
    renderer.render(bgScene, bgCam);
    // 2. 奥行き（深度）の情報をクリアする！！（これがないと敵が背景に埋もれる）
    renderer.clearDepth();
    // 3. 敵と弾を描画
    renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
