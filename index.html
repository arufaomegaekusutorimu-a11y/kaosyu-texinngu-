<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>顔シューティング - 究極再現版</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Arial Black', sans-serif; color: white; touch-action: none; }
        #ui-layer { position: absolute; inset: 0; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(0,0,0,0.8); text-align: center; }
        #guide-wrap { position: relative; width: 220px; height: 220px; border: 8px dashed #0f0; border-radius: 50%; display: none; margin-bottom: 20px; box-shadow: 0 0 50px #0f0; }
        
        .hud { position: absolute; z-index: 80; pointer-events: none; display: none; }
        #score-board { top: 20px; left: 20px; font-size: 28px; color: #0f0; text-shadow: 2px 2px #000; }
        #life-board { top: 20px; right: 20px; font-size: 28px; color: #ff0055; }
        #crosshair { top: 50%; left: 50%; transform: translate(-50%, -50%); width: 40px; height: 40px; border: 3px solid #fff; border-radius: 50%; }
        #damage-flash { position: absolute; inset: 0; background: red; opacity: 0; pointer-events: none; z-index: 90; }
        
        button { padding: 20px 40px; font-size: 1.5rem; cursor: pointer; background: #ff4400; color: white; border: none; border-radius: 50px; box-shadow: 0 5px #990000; }
        button:active { transform: translateY(4px); box-shadow: none; }
        canvas { display: none; }
    </style>
</head>
<body>

<div id="ui-layer">
    <h1 id="title">FACE SHOOTING</h1>
    <div id="guide-wrap"></div>
    <div class="controls">
        <p id="msg">カメラを許可して顔を撮影してください</p>
        <button id="btn-main">カメラ起動</button>
    </div>
</div>

<div id="damage-flash"></div>
<div id="score-board" class="hud">SCORE: 0</div>
<div id="life-board" class="hud">❤❤❤</div>
<div id="crosshair" class="hud"></div>

<canvas id="canv-base" width="256" height="256"></canvas>
<canvas id="canv-smile" width="256" height="256"></canvas>
<canvas id="canv-angry" width="256" height="256"></canvas>

<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>

<script type="module">
import * as THREE from 'three';

// --- ゲーム設定 ---
let state = 'TITLE', score = 0, life = 3, isGyroActive = false;
const targets = [], bullets = [], particles = [], faceTextures = [];
let video = document.createElement('video');
let lon = 0, lat = 0, cameraShake = 0;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

// 背景カメラ設定
const videoTexture = new THREE.VideoTexture(video);
const bgScene = new THREE.Scene();
const bgCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
const bgMaterial = new THREE.MeshBasicMaterial({ map: videoTexture, depthTest: false });
const bgMesh = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), bgMaterial);
bgScene.add(bgMesh);

// --- サウンド生成 (Web Audio API) ---
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function playSound(freq, type, duration) {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(10, audioCtx.currentTime + duration);
    gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
    gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + duration);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(); osc.stop(audioCtx.currentTime + duration);
}

// --- 顔処理 ---
function processFace(ctx, source, type) {
    ctx.clearRect(0, 0, 256, 256);
    ctx.save();
    ctx.beginPath(); ctx.arc(128, 128, 120, 0, Math.PI * 2); ctx.clip();
    ctx.drawImage(source, 0, 0, 256, 256);
    if (type === 'smile') {
        ctx.fillStyle = "rgba(255,255,0,0.2)"; ctx.fillRect(0,0,256,256);
    } else if (type === 'angry') {
        ctx.fillStyle = "rgba(255,0,0,0.3)"; ctx.fillRect(0,0,256,256);
    }
    ctx.restore();
}

function makeTextures(base) {
    const types = [['canv-base', 'normal'], ['canv-smile', 'smile'], ['canv-angry', 'angry']];
    types.forEach(([id, type]) => {
        const c = document.getElementById(id);
        processFace(c.getContext('2d'), base, type);
        const tex = new THREE.CanvasTexture(c);
        tex.colorSpace = THREE.SRGBColorSpace;
        faceTextures.push(tex);
    });
}

// --- 敵の生成 ---
function spawn() {
    const type = Math.random();
    let size = 3, hp = 1, speed = 0.02, color = 0xffffff, isGold = false;

    if (type > 0.9) { size = 8; hp = 5; speed = 0.01; } // ボス
    else if (type > 0.8) { size = 2.5; hp = 1; speed = 0.06; color = 0xffff00; isGold = true; } // 黄金

    const mat = new THREE.SpriteMaterial({ map: faceTextures[0], transparent: true, alphaTest: 0.5, color: color });
    const sprite = new THREE.Sprite(mat);
    sprite.scale.set(size, size, 1);
    
    const t = Math.random() * Math.PI * 2, p = (Math.random() - 0.5) * Math.PI * 0.5;
    sprite.position.setFromSphericalCoords(20, p + Math.PI/2, t);
    
    sprite.userData = { hp, speed, isGold, baseScale: size, offset: Math.random() * 10 };
    scene.add(sprite);
    targets.push(sprite);
}

// --- 破片エフェクト ---
function explode(pos, color) {
    for (let i = 0; i < 10; i++) {
        const pMat = new THREE.MeshBasicMaterial({ color: color, side: THREE.DoubleSide });
        const pMesh = new THREE.Mesh(new THREE.CircleGeometry(0.3, 3), pMat);
        pMesh.position.copy(pos);
        pMesh.userData.velo = new THREE.Vector3((Math.random()-0.5)*0.5, (Math.random()-0.5)*0.5, (Math.random()-0.5)*0.5);
        scene.add(pMesh);
        particles.push(pMesh);
    }
}

// --- メインループ ---
function animate() {
    requestAnimationFrame(animate);
    
    if (state === 'PLAY') {
        // カメラ揺れ
        if (cameraShake > 0) {
            camera.position.set(Math.random()*cameraShake, Math.random()*cameraShake, 0);
            cameraShake *= 0.9;
        }

        targets.forEach((t, i) => {
            // 接近
            t.position.lerp(camera.position, t.userData.speed);
            
            // 表情アニメ
            const mood = Math.floor(Date.now() * 0.003 + t.userData.offset) % 3;
            t.material.map = faceTextures[mood];

            // ダメージ判定
            if (t.position.distanceTo(camera.position) < 3) {
                life--;
                cameraShake = 0.5;
                document.getElementById('damage-flash').style.opacity = 1;
                setTimeout(() => document.getElementById('damage-flash').style.opacity = 0, 100);
                document.getElementById('life-board').innerText = "❤".repeat(life);
                playSound(100, 'sawtooth', 0.3);
                scene.remove(t); targets.splice(i, 1);
                if (life <= 0) alert("GAME OVER! SCORE: " + score), location.reload();
                spawn();
            }
        });

        bullets.forEach((b, i) => {
            b.position.add(b.userData.velo);
            targets.forEach((t, j) => {
                if (b.position.distanceTo(t.position) < t.userData.baseScale/2) {
                    t.userData.hp--;
                    scene.remove(b); bullets.splice(i, 1);
                    if (t.userData.hp <= 0) {
                        explode(t.position, t.userData.isGold ? 0xffff00 : 0xffffff);
                        playSound(600, 'square', 0.1);
                        score += t.userData.isGold ? 1000 : 100;
                        document.getElementById('score-board').innerText = `SCORE: ${score}`;
                        scene.remove(t); targets.splice(j, 1);
                        setTimeout(spawn, 1000);
                    }
                }
            });
            if (b.position.length() > 50) { scene.remove(b); bullets.splice(i, 1); }
        });

        particles.forEach((p, i) => {
            p.position.add(p.userData.velo);
            p.scale.multiplyScalar(0.95);
            if (p.scale.x < 0.01) { scene.remove(p); particles.splice(i, 1); }
        });

        if (!isGyroActive) {
            const phi = THREE.MathUtils.degToRad(90 - lat);
            const theta = THREE.MathUtils.degToRad(lon);
            camera.lookAt(new THREE.Vector3().setFromSphericalCoords(1, phi, theta));
        }
    }

    renderer.autoClear = false;
    renderer.clear();
    renderer.render(bgScene, bgCam);
    renderer.clearDepth();
    renderer.render(scene, camera);
}

// --- 入力系 ---
const btnMain = document.getElementById('btn-main');
btnMain.onclick = async () => {
    audioCtx.resume();
    if (state === 'TITLE') {
        const s = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
        video.srcObject = s; video.play();
        state = 'SCAN';
        document.getElementById('guide-wrap').style.display = 'block';
        btnMain.innerText = "撮影！";
    } else if (state === 'SCAN') {
        const canv = document.createElement('canvas');
        canv.width = canv.height = 256;
        const ctx = canv.getContext('2d');
        ctx.translate(256, 0); ctx.scale(-1, 1);
        const s = Math.min(video.videoWidth, video.videoHeight);
        ctx.drawImage(video, (video.videoWidth-s)/2, (video.videoHeight-s)/2, s, s, 0, 0, 256, 256);
        makeTextures(canv);
        
        document.getElementById('ui-layer').style.display = 'none';
        document.querySelectorAll('.hud').forEach(el => el.style.display = 'block');
        state = 'PLAY';
        spawn(); spawn(); spawn();
    }
};

window.addEventListener('pointerdown', () => {
    if (state !== 'PLAY') return;
    playSound(400, 'sine', 0.1);
    const b = new THREE.Mesh(new THREE.SphereGeometry(0.2), new THREE.MeshBasicMaterial({ color: 0xffff00 }));
    b.position.copy(camera.position);
    const dir = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
    b.userData.velo = dir.multiplyScalar(1.2);
    scene.add(b); bullets.push(b);
});

animate();
window.addEventListener('deviceorientation', (e) => { if(e.alpha){ isGyroActive=true; camera.rotation.set(THREE.MathUtils.degToRad(e.beta-90), THREE.MathUtils.degToRad(e.alpha), THREE.MathUtils.degToRad(e.gamma), 'YXZ'); } }, true);
</script>
</body>
</html>
